
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnLoop | Phone Camera</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #0b1020;
      color: #f3f6ff;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 520px;
      margin: auto;
    }

    section {
      background: #151d32;
      border: 1px solid #293550;
      border-radius: 14px;
      padding: 18px;
      margin-top: 18px;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background: #0b1020;
      color: white;
      border: 1px solid #52617e;
    }

    button {
      background: #8b7cff;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    video {
      width: 100%;
      max-height: 360px;
      background: #080b13;
      border-radius: 10px;
      margin-top: 12px;
    }

    #status {
      overflow-wrap: anywhere;
      color: #51dfad;
      line-height: 1.5;
    }

    .note {
      color: #bdc8df;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
<main>
  <h1>📱 LearnLoop Camera 2</h1>

  <p>
    Use this page on the phone whose camera you want
    to share with the laptop exam dashboard.
  </p>

  <p class="note">
    Camera access starts only after you tap the button.
    Allow permission only when you are ready to share.
  </p>

  <section>
    <label for="laptopId">Laptop session ID</label>

    <input
      id="laptopId"
      placeholder="Paste the ID shown on your laptop"
      autocomplete="off"
    >

    <button id="connectButton" onclick="connectCamera()">
      Start camera and connect
    </button>

    <button id="stopButton" onclick="stopCamera()">
      Stop camera
    </button>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
    ></video>

    <p id="status" role="status" aria-live="polite">
      Waiting for laptop session ID.
    </p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
let peer = null;
let phoneStream = null;
let phoneCall = null;
let starting = false;

const statusElement = document.getElementById("status");
const connectButton = document.getElementById("connectButton");
const laptopIdInput = document.getElementById("laptopId");
const localVideo = document.getElementById("localVideo");

function setStatus(message) {
  statusElement.textContent = message;
}

async function connectCamera() {
  if (starting || phoneStream) {
    setStatus("Camera is already starting or running.");
    return;
  }

  const laptopId = laptopIdInput.value.trim();

  if (!laptopId) {
    setStatus("Please enter the laptop session ID first.");
    return;
  }

  if (!window.isSecureContext) {
    setStatus(
      "Secure connection required. Open this page using HTTPS."
    );
    return;
  }

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    setStatus(
      "Camera API unavailable. Open this page in an updated browser over HTTPS."
    );
    return;
  }

  if (typeof Peer === "undefined") {
    setStatus(
      "PeerJS library did not load. Check your internet connection and refresh."
    );
    return;
  }

  starting = true;
  connectButton.disabled = true;

  try {
    setStatus("Requesting camera permission...");

    phoneStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" }
      },
      audio: false
    });

    localVideo.srcObject = phoneStream;

    try {
      await localVideo.play();
    } catch (playError) {
      // The browser may require video playback to start separately.
    }

    setStatus("Camera started. Connecting to PeerJS...");

    peer = new Peer();

    peer.on("open", function() {
      if (!phoneStream) return;

      setStatus("PeerJS ready. Calling the laptop...");

      phoneCall = peer.call(laptopId, phoneStream);

      if (!phoneCall) {
        setStatus(
          "Could not create the call. Check the laptop session ID."
        );
        stopCamera();
        return;
      }

      phoneCall.on("error", function(error) {
        setStatus(
          "Call error: " +
          (error.message || error.type || "Unknown error")
        );
      });

      phoneCall.on("close", function() {
        if (phoneStream) {
          setStatus(
            "Call closed. The camera is still running. You can stop it below."
          );
        }
      });

      setStatus(
        "Camera is on. Calling laptop; waiting for connection..."
      );
    });

    peer.on("error", function(error) {
      setStatus(
        "PeerJS error: " +
        (error.type || "unknown") +
        (error.message ? " — " + error.message : "")
      );

      if (!phoneStream) {
        connectButton.disabled = false;
      }
    });

    peer.on("disconnected", function() {
      setStatus(
        "PeerJS signaling disconnected. Check your internet connection."
      );
    });

    peer.on("close", function() {
      if (phoneStream) {
        setStatus("PeerJS session closed.");
      }
    });

  } catch (error) {
    cleanupResources();

    setStatus(
      "Could not start camera: " +
      (error.name || "Error") +
      " — " +
      (error.message || "No additional details")
    );
  } finally {
    starting = false;
    connectButton.disabled = false;
  }
}

function cleanupResources() {
  if (phoneCall) {
    try {
      phoneCall.close();
    } catch (error) {
      // Ignore cleanup errors.
    }
    phoneCall = null;
  }

  if (phoneStream) {
    phoneStream.getTracks().forEach(function(track) {
      track.stop();
    });
    phoneStream = null;
  }

  if (peer) {
    try {
      peer.destroy();
    } catch (error) {
      // Ignore cleanup errors.
    }
    peer = null;
  }

  localVideo.srcObject = null;
}

function stopCamera() {
  cleanupResources();
  starting = false;
  connectButton.disabled = false;
  setStatus("Camera is off.");
}

window.addEventListener("beforeunload", function() {
  cleanupResources();
});
</script>
</body>
</html>
